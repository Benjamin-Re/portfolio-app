<app-header>

</app-header>

<main class="main">

  <div class="container">
    <div class="main-content">
      <h1>My work</h1>
      <div class="card-container">
        @for (project of projects; track project.title) {
        <app-card [title]="project.title" [description]="project.description" [repoLink]="project.repoLink"
          [previewLink]="project.previewLink">
          <img [src]="project.img" alt="preview of project" />
        </app-card>
        }
      </div>
      <router-outlet />
    </div>
  </div>

</main>

<app-footer></app-footer>
